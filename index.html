<style>

<script>
const clone=o=>JSON.parse(JSON.stringify(o));

const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const OLDPAY=/^(Payment|Paid|Refund|Credit note) /;
const mig=(s,kind)=>{(s[kind]||[]).forEach(v=>{if(v.lines)return;const i=kind==='inv',m=(s.je||[]).find(j=>j.ref===v.no&&!OLDPAY.test(j.memo)),acc=i?'4000':(v.acc||(m&&m.lines[0].a)||'6300');v.tot=v.tot||v.amt;v.lines=[{item:'',d:v.desc||'',q:1,p:v.amt,acc,rate:i&&v.amt?Math.round((v.tax||0)/v.amt*100)/100:0,amt:v.amt,tax:v.tax||0}];v.pay=[];v.memo=v.memo||'';const pj=(s.je||[]).find(j=>j.ref===v.no&&/^(Payment|Paid) /.test(j.memo));if(v.paid&&pj)v.pay.push({id:pj.id,date:pj.date,amt:v.tot,k:'pay'})})};
const fix=s=>{['bank','con','inv','bill','je','cash','items'].forEach(k=>s[k]=s[k]||[]);s.co=s.co||{};s.lock=s.lock||'';mig(s,'inv');mig(s,'bill');return s};
const typing=()=>document.activeElement&&document.activeElement.matches('input,select,textarea');
const CFG=window.EASYBOOKS_CONFIG||{},CLOUD=!!(CFG.url&&CFG.key),enc=encodeURIComponent;
let CO={list:[],cur:'main'},S,cur='dash',E=null,from=null,G={a:'',f:'',t:''},poll=null,CT='sr',LANG=rd('adbooks.lang')||'en',ROLE=CLOUD?'viewer':'editor';
let syncMsg=CLOUD?'Connecting to the server...':'Saved in this browser only. Use Download backup to keep a copy.',busy=false,again=false,SESS=rd('adbooks.sess'),VER={};

const save=()=>{wr(lk(CO.cur),S);if(CLOUD)push()};
const AH=()=>{const h={apikey:CFG.key,'Content-Type':'application/json'};if(SESS)h.Authorization='Bearer '+SESS.access_token;return h};
async function api(path,o={}){const go=()=>fetch(CFG.url+path,{...o,headers:{...AH(),...(o.headers||{})}});let r=await go();if(r.status===401&&SESS&&await refreshTok())r=await go();if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw Object.assign(new Error(m||'Server error '+r.status),{code:r.status})}return r.status===204?null:r.json()}
async function authCall(grant,body){const r=await fetch(CFG.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign in failed');SESS={access_token:j.access_token,refresh_token:j.refresh_token,email:j.user&&j.user.email};wr('adbooks.sess',SESS)}

async function login(){try{await authCall('password',{email:val('em').trim(),password:val('pw')});render();await startCloud()}catch(e){toast(e.message)}}
async function logout(){SESS=null;S=null;wr('adbooks.sess',null);clearInterval(poll);render()}
function blankData(){const k=S;seed(true);const d=S;S=k;return d}
async function loadList(){const r=await api('/rest/v1/books?select=id,name,version&order=created_at.asc');CO.list=r.map(x=>({id:x.id,name:x.name}));r.forEach(x=>{if(x.id!==CO.cur)VER[x.id]=x.version});return r}

async function startCloud(){try{let r=await loadList();if(!r.length){await api('/rest/v1/books',{method:'POST',body:JSON.stringify({id:'main',name:'My company',data:blankData(),version:1})});await loadList()}
 try{CO.cur=localStorage.getItem('adbooks.cur')}catch(e){}if(!CO.list.some(c=>c.id===CO.cur))CO.cur=CO.list[0].id;await loadRole();await loadBook();snap();setSync('Connected. Saved on the server for everyone.');render();clearInterval(poll);poll=setInterval(tick,15000)}catch(e){setSync('Cannot reach the server: '+e.message);if(SESS)$('#main').innerHTML='<p class="neg">'+esc(syncMsg)+'</p><p><button onclick="startCloud()">Try again</button></p>'}}
async function tick(){if(!SESS||!S||document.hidden||busy||typing())return;try{const r=await api('/rest/v1/books?select=id,name,version&order=created_at.asc'),old=JSON.stringify(CO.list);CO.list=r.map(x=>({id:x.id,name:x.name}));const c=r.find(x=>x.id===CO.cur);let ch=old!==JSON.stringify(CO.list);if(!c&&r.length){CO.cur=r[0].id;await loadBook();ch=true;toast('The company you had open was deleted by someone else.')}else if(c&&c.version>VER[CO.cur]){await loadBook();ch=true;setSync('Updated from the server at '+new Date().toLocaleTimeString())}if(ch)render()}catch(e){}}
async function push(){if(busy){again=true;return}busy=true;try{const v=VER[CO.cur],r=await api('/rest/v1/books?id=eq.'+enc(CO.cur)+'&version=eq.'+v,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:S,version:v+1,updated_at:new Date().toISOString()})});if(r.length){VER[CO.cur]=v+1;setSync('Saved on the server at '+new Date().toLocaleTimeString())}else{again=false;setSync('Someone else saved first. Latest data loaded.');toast('Someone else saved at the same moment, so your last change was not saved. The latest data is now showing. Please repeat it.');await loadBook();render()}}catch(e){setSync('NOT saved to the server ('+(e.code||'offline')+'). Changes are only on this device.');toast('Could not save to the server.')}busy=false;if(again){again=false;push()}}
function seed(blank){
 S={n:1,acc:[['1000','Cash at Bank','asset'],['1100','Accounts Receivable','asset'],['1200','Inventory','asset'],['1500','Equipment','asset'],['2000','Accounts Payable','liability'],['2100','SST Payable','liability'],['3000','Owner Equity','equity'],['4000','Sales','income'],['4100','Other Income','income'],['5000','Cost of Sales','expense'],['6000','Salaries','expense'],['6100','Rent','expense'],['6200','Utilities','expense'],['6300','Office Supplies','expense'],['6400','Marketing','expense'],['6500','Professional Fees','expense'],['6600','Bank Charges','expense'],['6700','Travel','expense']].map(([code,name,type])=>({code,name,type})),inv:[],bill:[],je:[],bank:[],con:[],cash:[],items:[],co:{},lock:''};
 if(!blank){post('2026-10-01','Opening balance',[{a:'1000',d:5000000},{a:'3000',c:5000000}]);addDoc('inv',{party:'Sample Customer',date:'2026-10-05',due:'2026-11-04',pj:'Sample Project',lines:[{d:'Consulting service',q:'1',p:'8500',acc:'4000',rate:0.08}]});addDoc('bill',{party:'Sample Supplier',date:'2026-10-06',due:'2026-11-05',pj:'Sample Project',lines:[{d:'Office supplies',q:'1',p:'320',acc:'6300',rate:0}]})}}
function post(date,memo,lines,ref){chkLock(date);
 const d=lines.reduce((s,l)=>s+(l.d||0),0),c=lines.reduce((s,l)=>s+(l.c||0),0);
 if(!d||d!==c)throw new Error('Debits and credits must be equal and above zero.');
 if(lines.some(l=>!S.acc.find(a=>a.code===l.a)))throw new Error('Unknown account.');
 S.je.push({id:S.n++,date,memo,lines,ref:ref||''})}
const net=code=>S.je.reduce((s,j)=>s+j.lines.filter(l=>l.a===code).reduce((t,l)=>t+(l.d||0)-(l.c||0),0),0);
const nat=a=>['asset','expense'].includes(a.type)?net(a.code):-net(a.code);
const sum=t=>S.acc.filter(a=>a.type===t).reduce((s,a)=>s+nat(a),0);
const opts=(types,sel)=>S.acc.filter(a=>!types||types.includes(a.type)).map(a=>`<option value="${a.code}"${a.code===sel?' selected':''}>${esc(a.code+' '+a.name)}</option>`).join('');
const isPay=j=>OLDPAY.test(j.memo);
const docOf=no=>no&&[...S.inv,...S.bill,...S.cash].find(x=>x.no===no);
const listOf=no=>String(no).startsWith('INV')?S.inv:String(no).startsWith('BILL')?S.bill:S.cash;
const CK={sr:'Sales receipt',dep:'Bank deposit',exp:'Expense'},CP={sr:'SR-',dep:'DEP-',exp:'EXP-'};
const nextNo=(p,L)=>p+(Math.max(1000,...L.map(x=>parseInt(String(x.no).slice(p.length))||0))+1);
const canEdit=()=>!CLOUD||ROLE==='editor';
const payJE=v=>S.je.find(j=>j.ref===v.no&&isPay(j));
const mainJE=v=>S.je.find(j=>j.ref===v.no&&!isPay(j));
function contact(n,t){if(n&&!S.con.some(c=>c.name===n&&c.t===t))S.con.push({name:n,t,tel:'',mail:'',tin:''})}
const chkLock=d=>{if(S.lock&&d<=S.lock)throw new Error('The books are closed through '+S.lock+'. Change the closing date in Settings to make this change.')};
const bal=v=>v.tot-(v.pay||[]).reduce((s,p)=>s+p.amt,0),balAt=(v,d)=>v.date>d?0:v.tot-(v.pay||[]).filter(p=>p.date<=d).reduce((s,p)=>s+p.amt,0);
const syncDoc=v=>{v.paid=v.tot>0&&bal(v)<=0};
const sd=(a,x,dr,p)=>x>=0?(dr?{a,d:x,p}:{a,c:x,p}):(dr?{a,c:-x,p}:{a,d:-x,p});
const defAcc=k=>{const c=k==='inv'?'4000':'6300',ty=k==='inv'?'income':'expense';return S.acc.find(a=>a.code===c)?c:(S.acc.find(a=>a.type===ty)||{}).code||''};
const blank=k=>({item:'',d:'',q:'1',p:'',acc:defAcc(k),rate:0});
function calc(lines,kind){const i=kind==='inv',L=lines.map(l=>{const q=parseFloat(l.q),qq=isNaN(q)?0:q,p=cents(l.p),amt=Math.round(qq*p),rate=i?(parseFloat(l.rate)||0):0;return{item:l.item||'',d:(l.d||'').trim(),q:qq,p,acc:l.acc,rate,amt,tax:Math.round(amt*rate)}}).filter(l=>l.amt!==0||l.d),amt=L.reduce((s,l)=>s+l.amt,0),tax=L.reduce((s,l)=>s+l.tax,0);return{L,amt,tax,tot:amt+tax}}
function docJE(v,kind){const i=kind==='inv',L=i?[sd('1100',v.tot,true)]:[];v.lines.forEach(l=>{if(l.amt)L.push(sd(l.acc,l.amt,!i,v.pj))});if(i){if(v.tax)L.push(sd('2100',v.tax,false))}else L.push(sd('2000',v.tot,false));return L}
function addDoc(kind,o){const i=kind==='inv',list=i?S.inv:S.bill,c=calc(o.lines,kind);if(!o.party)throw new Error('Enter the '+(i?'customer':'vendor')+' name.');if(!c.L.length||c.tot<=0)throw new Error('Add at least one line with an amount above zero.');const no=nextNo(i?'INV-':'BILL-',list),v={no,[i?'cust':'ven']:o.party,date:o.date,due:o.due||o.date,memo:o.memo||'',pj:o.pj||'',lines:c.L,amt:c.amt,tax:c.tax,tot:c.tot,desc:c.L[0].d,pay:[],paid:false};post(v.date,no+' '+o.party,docJE(v,kind),no);contact(o.party,i?'c':'v');list.push(v);return v}
function updateDoc(v,kind,o){const i=kind==='inv',c=calc(o.lines,kind);if(!o.party)throw new Error('Enter the '+(i?'customer':'vendor')+' name.');if(!c.L.length||c.tot<=0)throw new Error('Add at least one line with an amount above zero.');chkLock(v.date);chkLock(o.date);const m=mainJE(v);Object.assign(v,{[i?'cust':'ven']:o.party,date:o.date,due:o.due||o.date,memo:o.memo||'',pj:o.pj||'',lines:c.L,amt:c.amt,tax:c.tax,tot:c.tot,desc:c.L[0].d});m.date=v.date;m.memo=v.no+' '+o.party;m.lines=docJE(v,kind);syncDoc(v);contact(o.party,i?'c':'v')}
function addPay(v,kind,date,amt,acct,how){const i=kind==='inv';let L,memo;if(how==='refund'){memo='Refund '+v.no;L=i?[{a:'1100',d:amt},{a:acct,c:amt}]:[{a:acct,d:amt},{a:'2000',c:amt}]}else{memo=(i?'Payment ':'Paid ')+v.no;L=i?[{a:acct,d:amt},{a:'1100',c:amt}]:[{a:'2000',d:amt},{a:acct,c:amt}]}post(date,memo,L,v.no);v.pay.push({id:S.n-1,date,amt:how==='refund'?-amt:amt,k:how});syncDoc(v)}
function addCredit(v,kind,o){const i=kind==='inv',tax=i?Math.round(o.amt*(o.rate||0)):0,tot=o.amt+tax,no=(i?'CN-':'VC-')+(S.cnc=(S.cnc||1000)+1),L=i?[{a:o.acc,d:o.amt,p:v.pj}].concat(tax?[{a:'2100',d:tax}]:[],[{a:'1100',c:tot}]):[{a:'2000',d:tot},{a:o.acc,c:tot,p:v.pj}];post(o.date,'Credit note '+no+' for '+v.no+(o.d?' - '+o.d:''),L,v.no);v.pay.push({id:S.n-1,date:o.date,amt:tot,k:'credit',cn:no});syncDoc(v)}
const KEYS={inv:['Invoice',x=>x.no],bill:['Bill',x=>x.no],cash:['Receipt or expense',x=>x.no],je:['Journal entry',x=>'#'+x.id],con:['Contact',x=>x.name],acc:['Account',x=>x.code],bank:['Bank line',x=>x.date+' '+x.desc]};
function diffSum(a,b){const o=[];for(const k in KEYS){const[n,f]=KEYS[k],pick=L=>(L||[]).filter(x=>k!=='je'||!x.ref),A=new Map(pick(a[k]).map(x=>[f(x),JSON.stringify(x)])),B=new Map(pick(b[k]).map(x=>[f(x),JSON.stringify(x)]));B.forEach((v,key)=>{if(!A.has(key))o.push(n+' '+key+' added');else if(A.get(key)!==v)o.push(n+' '+key+' changed')});A.forEach((v,key)=>{if(!B.has(key))o.push(n+' '+key+' deleted')})}return o.join('; ').slice(0,500)}

function run(fn,ok){try{const b=CLOUD?clone(S):null;fn();save();if(CLOUD)audit(ok,diffSum(b,S));toast(ok);render()}catch(e){toast(e.message)}}

const CANCEL='<button class="g" onclick="cancel()">Cancel</button>';

function draft(kind,e){const key=e?e.no:'new';if(!DR||DR.kind!==kind||DR.key!==key)DR=e?{kind,key,party:e.cust||e.ven,date:e.date,due:e.due||e.date,pj:e.pj||'',memo:e.memo||'',lines:e.lines.map(l=>({item:l.item,d:l.d,q:String(l.q),p:amtv(l.p),acc:l.acc,rate:l.rate}))}:{kind,key,party:'',date:today(),due:today(),pj:'',memo:'',lines:[blank(kind)]};return DR}
const sstSel=(v,on)=>`<select onchange="${on}">${[0,0.06,0.08].map(x=>`<option value="${x}"${x===(parseFloat(v)||0)?' selected':''}>${x?x*100+'%':'None'}</option>`).join('')}</select>`;
function lineRow(l,n,kind){const i=kind==='inv';return `<tr><td><select onchange="pickItem(${n},this.value)" aria-label="Item"><option value="">-</option>${S.items.map(x=>`<option value="${x.id}"${String(x.id)===String(l.item)?' selected':''}>${esc(x.name)}</option>`).join('')}</select></td><td><input value="${esc(l.d)}" onchange="DR.lines[${n}].d=this.value" aria-label="Description" style="width:100%;min-width:140px"></td><td><input type="number" step="any" value="${esc(l.q)}" onchange="DR.lines[${n}].q=this.value;recalc()" aria-label="Quantity" style="width:70px"></td><td><input type="number" step="0.01" value="${esc(l.p)}" onchange="DR.lines[${n}].p=this.value;recalc()" aria-label="Price" style="width:100px"></td><td><select onchange="DR.lines[${n}].acc=this.value" aria-label="Account">${opts(i?['income']:['expense'],l.acc)}</select></td>${i?`<td>${sstSel(l.rate,`DR.lines[${n}].rate=this.value;recalc()`)}</td>`:''}<td class="n" id="lt${n}">${rm(Math.round((parseFloat(l.q)||0)*cents(l.p)))}</td><td><button class="g" onclick="rmLine(${n})" aria-label="Remove line">x</button></td></tr>`}
function pickItem(n,id){const x=S.items.find(z=>String(z.id)===id),l=DR.lines[n],i=DR.kind==='inv';l.item=id;if(x){l.d=x.name;l.p=amtv(i?x.price:(x.cost||0));l.acc=i?x.acc:(x.bacc||l.acc);l.rate=i?x.rate:0}render()}
function addLine(){DR.lines.push(blank(DR.kind));render()}
function rmLine(n){if(DR.lines.length>1)DR.lines.splice(n,1);render()}
function recalc(){const c=calc(DR.lines,DR.kind);DR.lines.forEach((l,n)=>{const e=$('#lt'+n);if(e)e.textContent=rm(Math.round((parseFloat(l.q)||0)*cents(l.p)))});const e=$('#dt');if(e)e.textContent=totText(c,DR.kind==='inv')}
function panel(t,kind,no){PANEL={t,kind,no};render();scrollTo(0,0)}

// Navigation and rendering with search capability added
const NAV=[{id:'dash',l:'Dashboard'},{id:'inv',l:'Invoices'},{id:'bill',l:'Bills'},{id:'je',l:'Ledger & Journal'},{id:'cash',l:'Banking'},{id:'bank',l:'Bank recon'},{id:'items',l:'Items'},{id:'con',l:'Contacts'},{id:'acc',l:'Chart of accounts'},{id:'rep',l:'Reports'},{id:'set',l:'Settings'}];
function go(k){cur=k;E=null;PANEL=null;render()}
function edit(k,i){E={k,i};render();scrollTo(0,0)}
function cancel(){E=null;PANEL=null;render()}
function openTx(id){cur='je';E={k:'je',i:id};render();scrollTo(0,0)}
function resetData(blank,btn){if(confirm('Are you sure? This will replace all current data.')){seed(blank);save();toast('Data reset successfully');go('dash')}}
function del(k,i,btn){if(confirm('Delete this record?')){run(()=>{if(k==='inv')S.inv.splice(i,1);else if(k==='bill')S.bill.splice(i,1);else if(k==='je'){const j=S.je[i];if(j)S.je.splice(i,1)}else if(k==='cash')S.cash.splice(i,1);else if(k==='items')S.items.splice(i,1);else if(k==='con')S.con.splice(i,1);else if(k==='acc')S.acc.splice(i,1)},'Deleted successfully')}}

function render(){
 const nav=$('#nav');if(nav)nav.innerHTML=`<h1>Easy Books</h1><div class="co">${CLOUD?`<select onchange="switchCo(this.value)">${CO.list.map(c=>`<option value="${c.id}"${c.id===CO.cur?' selected':''}>${esc(c.name)}</option>`).join('')}</select><button class="g" onclick="newCo()" style="width:100%;margin-top:4px">+ New company</button>`:''}</div>${NAV.map(n=>`<a class="${cur===n.id?'on':''}" onclick="go('${n.id}')">${n.l}</a>`).join('')}<div style="margin-top:20px;padding:8px;font-size:12px;color:var(--mute)" id="sync">${esc(syncMsg)}</div>`;
 const t=$('#title');if(t)t.textContent=(NAV.find(n=>n.id===cur)||{}).l||'';
 const m=$('#main');if(m){
  let html='';
  if(cur==='dash') html=V.dash();
  else if(cur==='inv') html=V.inv();
  else if(cur==='bill') html=V.bill();
  else if(cur==='je') html=V.je();
  else if(cur==='cash') html=V.cash();
  else if(cur==='bank') html=V.bank();
  else if(cur==='items') html=V.items();
  else if(cur==='con') html=V.con();
  else if(cur==='acc') html=V.acc();
  else if(cur==='rep') html=V.rep();
  else if(cur==='set') html=V.set();
  m.innerHTML=`<div class="box" style="margin-bottom:12px;display:flex;gap:10px;align-items:center"><input type="text" id="global-search" placeholder="Search records, descriptions, amounts..." value="${esc(globalSearchQuery)}" oninput="globalSearchQuery=this.value;renderSearch()" style="flex:1"></div><div id="tab-content">${html}</div>`;
 }
}

function renderSearch(){
 const q=globalSearchQuery.toLowerCase();
 const rows=document.querySelectorAll('#tab-content tr, #tab-content .card, #tab-content .box');
 if(!q){document.querySelectorAll('#tab-content tr').forEach(r=>r.style.display='');return;}
 document.querySelectorAll('#tab-content tr').forEach(r=>{
  const txt=r.textContent.toLowerCase();
  r.style.display=txt.includes(q)?'':'none';
 });
}

// Defining View renderers for tables and modules
V.dash=function(){
 const inc=sum('income'),exp=sum('expense'),mx=Math.max(inc,exp,1);
 return `<div class="form" style="margin-bottom:14px"><button onclick="go('inv')">Create invoice</button><button onclick="go('bill')">Enter bill</button><button onclick="go('bank')">Import bank statement</button><button onclick="CT='sr';go('cash')">Sales receipt</button><button onclick="CT='exp';go('cash')">Expense</button></div><div class="grid"><div class="card"><div class="k">Cash at bank</div><div class="v">${rm(net('1000'))}</div></div>
 <div class="card"><div class="k">Owed to you</div><div class="v">${rm(net('1100'))}</div></div>
 <div class="card"><div class="k">You owe</div><div class="v">${rm(-net('2000'))}</div></div>
 <div class="card"><div class="k">Profit so far</div><div class="v ${inc-exp<0?'neg':''}">${rm(inc-exp)}</div></div></div>
 <div class="box"><div class="k">Income ${rm(inc)}</div><div class="bar" style="width:${inc/mx*100}%"></div><div class="k" style="margin-top:10px">Expenses ${rm(exp)}</div><div class="bar e" style="width:${exp/mx*100}%"></div></div>
 <h3>Recent activity <span class="k">(click one to open it)</span></h3><div class="box wrap"><table><tr><th>Date</th><th>Description</th><th class="n">Amount</th></tr>${S.je.slice(-6).reverse().map(j=>`<tr class="click" onclick="openTx(${j.id})"><td>${j.date}</td><td>${esc(j.memo)}</td><td class="n">${rm(j.lines.reduce((s,l)=>s+(l.d||0),0))}</td></tr>`).join('')}</table></div>
 <div class="eo"><h3>Data</h3><p class="k">Start fresh whenever you like. This erases everything in this company.</p><p><button class="g" onclick="resetData(true,this)">Start blank company</button> <button class="g" onclick="resetData(false,this)">Load sample data</button> <button class="g" onclick="backup()">Download backup</button></p></div>`;
};

V.inv=function(){return docView('inv')};
V.bill=function(){return docView('bill')};

V.je=function(){
 const e=ed();
 const rows=S.je.slice().reverse().map((j,idx)=>{
  const originalIdx=S.je.length-1-idx;
  return `<tr class="${E&&E.i===j.id?'hl':''}" onclick="openTx(${j.id})"><td>${j.date}</td><td>${esc(j.memo)}</td><td>${esc(j.ref||'')}</td><td class="n">${rm(j.lines.reduce((s,l)=>s+(l.d||0),0))}</td><td><button class="g" onclick="event.stopPropagation();del('je',${originalIdx},this)">Delete</button></td></tr>`;
 }).join('');
 return `<div class="box eo">
  <h3>General Ledger & Journal Entries</h3>
  <form onsubmit="event.preventDefault();addManualJE()" class="form" style="margin-top:10px">
   <label>Date<input type="date" id="je-date" value="${today()}"></label>
   <label>Memo<input type="text" id="je-memo" placeholder="Description" required></label>
   <label>Account<select id="je-acc">${opts(null,'1000')}</select></label>
   <label>Debit (RM)<input type="number" step="0.01" id="je-dr" value="0.00"></label>
   <label>Credit (RM)<input type="number" step="0.01" id="je-cr" value="0.00"></label>
   <button type="submit">Post Entry</button>
  </form>
 </div>
 <div class="box wrap">
  <table>
   <tr><th>Date</th><th>Memo</th><th>Ref</th><th class="n">Amount</th><th></th></tr>
   ${rows||'<tr><td colspan=5>No journal entries found.</td></tr>'}
  </table>
 </div>`;
};

function addManualJE(){
 const date=val('je-date'), memo=val('je-memo'), acc=val('je-acc');
 const dr=cents(val('je-dr')), cr=cents(val('je-cr'));
 if(dr===cr) { toast('Debit and credit cannot be equal/zero'); return; }
 const lines = dr > 0 ? [{a:acc, d:dr}, {a:'1000', c:dr}] : [{a:'1000', d:cr}, {a:acc, c:cr}];
 run(()=>post(date, memo, lines), 'Journal entry posted');
}

V.cash=function(){
 return `<div class="box"><h3>Banking / Cash Receipts & Expenses</h3><p class="k">Record receipts, deposits, or cash expenses directly.</p></div>`;
};

V.bank=function(){
 return `<div class="box"><h3>Bank Reconciliation</h3><p class="k">Upload CSV bank statements to reconcile transactions.</p><input type="file" accept=".csv" class="mb-4 block"></div>`;
};

V.items=function(){
 const e=ed();
 return `<div class="box eo"><div class="form">${e?'<b>Editing item</b>':''}<label>Name<input id="n" value="${esc(e&&e.name)}"></label><label>Type<select id="t"><option value="s"${e&&e.kind==='p'?'':' selected'}>Service</option><option value="p"${e&&e.kind==='p'?' selected':''}>Product</option></select></label><label>Selling price (RM)<input id="a" type="number" step="0.01" value="${e?amtv(e.price):''}"></label><label>Income account<select id="ac">${opts(['income'],e?e.acc:defAcc('inv'))}</select></label><label>SST<select id="r">${[0,0.06,0.08].map(x=>`<option value="${x}"${e&&x===e.rate?' selected':''}>${x?x*100+'%':'None'}</option>`).join('')}</select></label><button onclick="${e?`saveItem(${e.id})`:'newItem()'}">${e?'Save changes':'Save item'}</button>${e?CANCEL:''}</div></div><div class="box wrap"><table><tr><th>Name</th><th>Type</th><th class="n">Price</th><th>SST</th><th></th></tr>${(S.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.kind==='p'?'Product':'Service'}</td><td class="n">${rm(x.price)}</td><td>${x.rate?x.rate*100+'%':''}</td><td><button class="g" onclick="edit('items',${x.id})">Edit</button> <button class="g" onclick="del('items',${x.id},this)">Delete</button></td></tr>`).join('')||'<tr><td colspan=5>No items yet.</td></tr>'}</table></div>`;
};

V.con=function(){
 return `<div class="box"><h3>Contacts (Customers & Vendors</h3><div class="wrap"><table><tr><th>Name</th><th>Type</th></tr>${(S.con||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${c.t==='c'?'Customer':'Vendor'}</td></tr>`).join('')||'<tr><td colspan=2>No contacts yet.</td></tr>'}</table></div></div>`;
};

V.acc=function(){
 return `<div class="box"><h3>Chart of Accounts</h3><div class="wrap"><table><tr><th>Code</th><th>Name</th><th>Type</th></tr>${S.acc.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td>${a.type}</td></tr>`).join('')}</table></div></div>`;
};

V.rep=function(){
 return `<div class="box"><h3>Financial Reports</h3><p class="k">Profit & Loss, Balance Sheet, Trial Balance.</p></div>`;
};

V.set=function(){
 const c=S.co||{};
 return `<div class="box eo"><h3>Company Settings</h3><label>Company Name<input id="co-name" value="${esc(c.name||'')}"></label><label>Address<textarea id="co-addr">${esc(c.addr||'')}</textarea></label><button onclick="saveSettings()">Save Settings</button></div>`;
};

function saveSettings(){
 S.co = S.co || {};
 S.co.name = val('co-name');
 S.co.addr = val('co-addr');
 save();
 toast('Settings saved');
}

function newItem(){
 reqd('n','a');
 S.items.push({id:S.n++, name:val('n'), kind:val('t'), price:cents(val('a')), acc:val('ac'), rate:parseFloat(val('r'))});
 save(); toast('Item added'); go('items');
}

function saveItem(id){
 const x=S.items.find(i=>i.id===id);
 if(x){ x.name=val('n'); x.kind=val('t'); x.price=cents(val('a')); x.acc=val('ac'); x.rate=parseFloat(val('r')); save(); toast('Item updated'); go('items'); }
}

function backup(){
 const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a'); a.href = url; a.download = 'accounting-backup.json'; a.click();
}

function docView(kind){
 const i=kind==='inv',e=ed(),D=draft(kind,e),L=i?S.inv:S.bill,P=PANEL&&PANEL.kind===kind?PANEL:null,pv=P&&docOf(P.no),c=calc(D.lines,kind),who=i?'Customer':'Vendor';
 const pan=P?`<div class="box eo"><div class="form"><b>${{pay:i?'Receive payment':'Pay bill',refund:'Refund',cn:i?'Credit note':'Vendor credit'}[P.t]} - ${P.no}</b><label>Date<input id="pd" type="date" value="${today()}"></label>${P.t==='cn'?'<label>Reason<input id="px"></label>':''}<label>Amount (RM)<input id="pa" type="number" step="0.01" value="${P.t==='pay'?amtv(Math.max(0,bal(pv))):''}"></label><button onclick="savePanel()">Save</button><button class="g" onclick="PANEL=null;render()">Cancel</button></div></div>`:'';
 const entry=`<div class="box eo"><div class="form">${e?`<b>Editing ${e.no}</b>`:''}<label>${who}<input list="cl" value="${esc(D.party)}" onchange="DR.party=this.value"></label><label>Issued<input type="date" value="${D.date}" onchange="DR.date=this.value"></label><label>Due<input type="date" value="${D.due}" onchange="DR.due=this.value"></label></div>
 <div class="wrap" style="margin-top:10px"><table><tr><th>Item</th><th>Description</th><th>Qty</th><th>Price</th><th>Account</th>${i?'<th>SST</th>':''}<th class="n">Line total</th><th></th></tr>${D.lines.map((l,n)=>lineRow(l,n,kind)).join('')}</table></div>
 <div class="form" style="margin-top:8px"><button class="g" onclick="addLine()">Add line</button><b id="dt" style="margin-left:auto">${totText(c,i)}</b></div>
 <div class="form" style="margin-top:10px"><button onclick="saveDoc('${kind}')">${e?'Save changes':i?'Save invoice':'Save bill'}</button>${e?CANCEL:''}</div></div>`;
 const rows=L.map((v,k)=>[v,k]).reverse().map(([v,k])=>{const b=bal(v),st=b===0?'<span class="tag p">Paid</span>':'<span class="tag">Open</span>';
  return `<tr><td>${v.no}</td><td>${esc(v.cust||v.ven)}</td><td>${v.date}</td><td class="n">${rm(v.tot)}</td><td class="n">${rm(b)}</td><td>${st}</td><td><button class="g" onclick="panel('pay','${kind}','${v.no}')">${i?'Receive payment':'Pay bill'}</button> <button class="g" onclick="edit('${kind}','${v.no}')">Edit</button> <button class="g" onclick="del('${kind}',${k},this)">Delete</button></td></tr>`}).join('');
 return `${pan}${entry}<div class="box wrap"><table><tr><th>No.</th><th>${who}</th><th>Issued</th><th class="n">Total</th><th class="n">Balance</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan=7>Nothing here yet.</td></tr>'}</table></div>`;
}

function saveDoc(kind){
 try{
  const e=ed();
  if(e) updateDoc(e,kind,DR); else addDoc(kind,DR);
  DR=null; save(); toast('Saved successfully'); render();
 }catch(err){ toast(err.message); }
}

function savePanel(){
 try{
  const pv=docOf(PANEL.no), amt=cents(val('pa')), dt=val('pd');
  if(PANEL.t==='pay') addPay(pv,PANEL.kind,dt,amt,'1000','pay');
  PANEL=null; save(); toast('Recorded successfully'); render();
 }catch(err){ toast(err.message); }
}

// Initial seed if empty
if(!rd(lk('main'))){ seed(false); save(); }
else { S=fix(rd(lk('main'))); }

render();
</script>
</body></html>
