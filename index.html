<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounting-to-Go</title>
<style>
:root{--bg:#000000;--panel:#121212;--ink:#ffffff;--mute:#9ca3af;--line:#27272a;--acc:#ffffff;--accink:#000000;--side:#0a0a0a;--sideink:#d1d5db;--neg:#f87171;--pos:#34d399;--hl:#18181b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--side);color:var(--sideink);padding:16px 10px;flex:none;border-right:1px solid var(--line)}
nav h1{font:700 18px Georgia,serif;color:#fff;margin:0 8px 12px}
nav a{display:block;padding:9px 12px;border-radius:6px;color:inherit;text-decoration:none;cursor:pointer}
nav a.on,nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.co{margin-bottom:14px}.co select,.co input{width:100%;margin-bottom:6px}
main{flex:1;min-width:0;padding:20px 26px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
h2{font:700 22px Georgia,serif;margin:0}h3{margin:22px 0 8px;font-size:16px}
.card,.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.k{color:var(--mute);font-size:13px}.v{font:600 22px Georgia,serif}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:13px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
input,select,button,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button{background:var(--acc);color:var(--accink);border:0;cursor:pointer;font-weight:600}button.g{background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 9px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:2px}
.bar{height:14px;border-radius:4px;background:#ffffff}.bar.e{background:var(--neg)}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}.tag.p{color:var(--pos);border-color:var(--pos)}.tag.neg{color:var(--neg);border-color:var(--neg)}
tr.click{cursor:pointer}tr.click:hover td,tr.hl td{background:var(--hl)}
details{position:relative}summary{list-style:none;background:var(--acc);color:var(--accink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600}
details div{position:absolute;right:0;top:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:170px;z-index:5;padding:6px}
details a{display:block;padding:8px 10px;cursor:pointer;border-radius:6px}details a:hover{background:var(--hl)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9}
.neg{color:var(--neg)}.sub td{font-weight:700}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:10px}nav h1{display:none}nav a{white-space:nowrap}main{padding:16px}}
</style>
<script src="config.js"></script></head><body>
<nav id="nav"></nav>
<main><div class="top"><h2 id="title"></h2>
<details><summary>+ New</summary><div><a onclick="go('inv')">Invoice</a><a onclick="go('bill')">Bill</a><a onclick="CT='sr';go('cash')">Sales receipt</a><a onclick="CT='dep';go('cash')">Bank deposit</a><a onclick="CT='exp';go('cash')">Expense</a><a onclick="go('je')">Journal entry</a></div></details></div>
<div id="main"></div></main><div id="toast" role="status"></div><datalist id="cl"></datalist><datalist id="pl"></datalist>
<script>
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents=v=>Math.round(parseFloat(v||0)*100);
const rm=c=>(c<0?'-':'')+'RM '+(Math.abs(c)/100).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const amtv=c=>(c/100).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
const $=s=>document.querySelector(s);
const val=id=>$('#'+id).value;
const lk=id=>id==='main'?'adbooks.v1':'adbooks.c.'+id;
const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const OLDPAY=/^(Payment|Paid|Refund|Credit note) /;
const mig=(s,kind)=>{(s[kind]||[]).forEach(v=>{if(v.lines)return;const i=kind==='inv',m=(s.je||[]).find(j=>j.ref===v.no&&!OLDPAY.test(j.memo)),acc=i?'4000':(v.acc||(m&&m.lines[0].a)||'6300');v.tot=v.tot||v.amt;v.lines=[{item:'',d:v.desc||'',q:1,p:v.amt,acc,rate:i&&v.amt?Math.round((v.tax||0)/v.amt*100)/100:0,amt:v.amt,tax:v.tax||0}];v.pay=[];v.memo=v.memo||'';const pj=(s.je||[]).find(j=>j.ref===v.no&&/^(Payment|Paid) /.test(j.memo));if(v.paid&&pj)v.pay.push({id:pj.id,date:pj.date,amt:v.tot,k:'pay'})})};
const fix=s=>{['bank','con','inv','bill','je','cash','items'].forEach(k=>s[k]=s[k]||[]);s.co=s.co||{};s.lock=s.lock||'';mig(s,'inv');mig(s,'bill');return s};
const typing=()=>document.activeElement&&document.activeElement.matches('input,select,textarea');
const CFG=window.EASYBOOKS_CONFIG||{},CLOUD=!!(CFG.url&&CFG.key),enc=encodeURIComponent;
let CO={list:[],cur:'main'},S,cur='dash',E=null,from=null,G={a:'',f:'',t:''},poll=null,CT='sr',ROLE=CLOUD?'viewer':'editor';
let syncMsg=CLOUD?'Connecting to the server...':'Saved in this browser only. Use Download backup to keep a copy.',busy=false,again=false,SESS=rd('adbooks.sess'),VER={};
function setSync(m){syncMsg=m;const e=$('#sync');if(e)e.textContent=m}
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
const save=()=>{wr(lk(CO.cur),S);if(CLOUD)push()};
const AH=()=>{const h={apikey:CFG.key,'Content-Type':'application/json'};if(SESS)h.Authorization='Bearer '+SESS.access_token;return h};
async function api(path,o={}){const go=()=>fetch(CFG.url+path,{...o,headers:{...AH(),...(o.headers||{})}});let r=await go();if(r.status===401&&SESS&&await refreshTok())r=await go();if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw Object.assign(new Error(m||'Server error '+r.status),{code:r.status})}return r.status===204?null:r.json()}
function seed(blank){
 S={n:1,acc:[['1000','Cash at Bank','asset'],['1100','Accounts Receivable','asset'],['1200','Inventory','asset'],['1500','Equipment','asset'],['2000','Accounts Payable','liability'],['2100','SST Payable','liability'],['3000','Owner Equity','equity'],['4000','Sales','income'],['4100','Other Income','income'],['5000','Cost of Sales','expense'],['6000','Salaries','expense'],['6100','Rent','expense'],['6200','Utilities','expense'],['6300','Office Supplies','expense'],['6400','Marketing','expense'],['6500','Professional Fees','expense'],['6600','Bank Charges','expense'],['6700','Travel','expense']].map(([code,name,type])=>({code,name,type})),inv:[],bill:[],je:[],bank:[],con:[],cash:[],items:[],co:{},lock:''};
 if(!blank){post('2026-10-01','Opening balance',[{a:'1000',d:5000000},{a:'3000',c:5000000}]);addDoc('inv',{party:'Sample Customer',date:'2026-10-05',due:'2026-11-04',pj:'Sample Project',lines:[{d:'Consulting service',q:'1',p:'8500',acc:'4000',rate:0.08}]});addDoc('bill',{party:'Sample Supplier',date:'2026-10-06',due:'2026-11-05',pj:'Sample Project',lines:[{d:'Office supplies',q:'1',p:'320',acc:'6300',rate:0}]})}}
function post(date,memo,lines,ref){
 const d=lines.reduce((s,l)=>s+(l.d||0),0),c=lines.reduce((s,l)=>s+(l.c||0),0);
 if(!d||d!==c)throw new Error('Debits and credits must be equal and above zero.');
 S.je.push({id:S.n++,date,memo,lines,ref:ref||''})}
const net=code=>S.je.reduce((s,j)=>s+j.lines.filter(l=>l.a===code).reduce((t,l)=>t+(l.d||0)-(l.c||0),0),0);
const sum=t=>S.acc.filter(a=>a.type===t).reduce((s,a)=>s+(['asset','expense'].includes(a.type)?net(a.code):-net(a.code)),0);
const opts=(types,sel)=>S.acc.filter(a=>!types||types.includes(a.type)).map(a=>`<option value="${a.code}"${a.code===sel?' selected':''}>${esc(a.code+' '+a.name)}</option>`).join('');
const docOf=no=>no&&[...S.inv,...S.bill,...S.cash].find(x=>x.no===no);
const nextNo=(p,L)=>p+(Math.max(1000,...L.map(x=>parseInt(String(x.no).slice(p.length))||0))+1);
const bal=v=>v.tot-(v.pay||[]).reduce((s,p)=>s+p.amt,0);
const syncDoc=v=>{v.paid=v.tot>0&&bal(v)<=0};
const sd=(a,x,dr,p)=>x>=0?(dr?{a,d:x,p}:{a,c:x,p}):(dr?{a,c:-x,p}:{a,d:-x,p});
const defAcc=k=>{const c=k==='inv'?'4000':'6300',ty=k==='inv'?'income':'expense';return S.acc.find(a=>a.code===c)?c:(S.acc.find(a=>a.type===ty)||{}).code||''};
const blank=k=>({item:'',d:'',q:'1',p:'',acc:defAcc(k),rate:0});
function calc(lines,kind){const i=kind==='inv',L=lines.map(l=>{const q=parseFloat(l.q),qq=isNaN(q)?0:q,p=cents(l.p),amt=Math.round(qq*p),rate=i?(parseFloat(l.rate)||0):0;return{item:l.item||'',d:(l.d||'').trim(),q:qq,p,acc:l.acc,rate,amt,tax:Math.round(amt*rate)}}).filter(l=>l.amt!==0||l.d),amt=L.reduce((s,l)=>s+l.amt,0),tax=L.reduce((s,l)=>s+l.tax,0);return{L,amt,tax,tot:amt+tax}}
function docJE(v,kind){const i=kind==='inv',L=i?[sd('1100',v.tot,true)]:[];v.lines.forEach(l=>{if(l.amt)L.push(sd(l.acc,l.amt,!i,v.pj))});if(i){if(v.tax)L.push(sd('2100',v.tax,false))}else L.push(sd('2000',v.tot,false));return L}
function addDoc(kind,o){const i=kind==='inv',list=i?S.inv:S.bill,c=calc(o.lines,kind);if(!o.party)throw new Error('Enter name.');const no=nextNo(i?'INV-':'BILL-',list),v={no,[i?'cust':'ven']:o.party,date:o.date,due:o.due||o.date,memo:o.memo||'',pj:o.pj||'',lines:c.L,amt:c.amt,tax:c.tax,tot:c.tot,pay:[],paid:false};post(v.date,no+' '+o.party,docJE(v,kind),no);list.push(v);return v}
function updateDoc(v,kind,o){const i=kind==='inv',c=calc(o.lines,kind);const m=S.je.find(j=>j.ref===v.no&&!/^(Payment|Paid) /.test(j.memo));Object.assign(v,{[i?'cust':'ven']:o.party,date:o.date,due:o.due||o.date,lines:c.L,amt:c.amt,tax:c.tax,tot:c.tot});if(m){m.date=v.date;m.memo=v.no+' '+o.party;m.lines=docJE(v,kind)}syncDoc(v)}
function addPay(v,kind,date,amt,acct){const i=kind==='inv';post(date,(i?'Payment ':'Paid ')+v.no,i?[{a:acct,d:amt},{a:'1100',c:amt}]:[{a:'2000',d:amt},{a:acct,c:amt}],v.no);v.pay.push({id:S.n-1,date,amt,k:'pay'});syncDoc(v)}

let DR=null,PANEL=null,globalSearchQuery='';
const totText=(c,i)=>'Subtotal '+rm(c.amt)+(i?'    SST '+rm(c.tax):'')+'    Total '+rm(c.tot);
function draft(kind,e){const key=e?e.no:'new';if(!DR||DR.kind!==kind||DR.key!==key)DR=e?{kind,key,party:e.cust||e.ven,date:e.date,due:e.due||e.date,pj:e.pj||'',memo:e.memo||'',lines:e.lines.map(l=>({item:l.item,d:l.d,q:String(l.q),p:amtv(l.p),acc:l.acc,rate:l.rate}))}:{kind,key,party:'',date:today(),due:today(),pj:'',memo:'',lines:[blank(kind)]};return DR}
const sstSel=(v,on)=>`<select onchange="${on}">${[0,0.06,0.08].map(x=>`<option value="${x}"${x===(parseFloat(v)||0)?' selected':''}>${x?x*100+'%':'None'}</option>`).join('')}</select>`;
function lineRow(l,n,kind){const i=kind==='inv';return `<tr><td><select onchange="pickItem(${n},this.value)"><option value="">-</option>${S.items.map(x=>`<option value="${x.id}"${String(x.id)===String(l.item)?' selected':''}>${esc(x.name)}</option>`).join('')}</select></td><td><input value="${esc(l.d)}" onchange="DR.lines[${n}].d=this.value" style="width:100%;min-width:140px"></td><td><input type="number" step="any" value="${esc(l.q)}" onchange="DR.lines[${n}].q=this.value;recalc()" style="width:70px"></td><td><input type="number" step="0.01" value="${esc(l.p)}" onchange="DR.lines[${n}].p=this.value;recalc()" style="width:100px"></td><td><select onchange="DR.lines[${n}].acc=this.value">${opts(i?['income']:['expense'],l.acc)}</select></td>${i?`<td>${sstSel(l.rate,`DR.lines[${n}].rate=this.value;recalc()`)}</td>`:''}<td class="n" id="lt${n}">${rm(Math.round((parseFloat(l.q)||0)*cents(l.p)))}</td><td><button class="g" onclick="rmLine(${n})">x</button></td></tr>`}
function pickItem(n,id){const x=S.items.find(z=>String(z.id)===id),l=DR.lines[n],i=DR.kind==='inv';l.item=id;if(x){l.d=x.name;l.p=amtv(i?x.price:(x.cost||0));l.acc=i?x.acc:(x.bacc||l.acc);l.rate=i?x.rate:0}render()}
function addLine(){DR.lines.push(blank(DR.kind));render()}
function rmLine(n){if(DR.lines.length>1)DR.lines.splice(n,1);render()}
function recalc(){const c=calc(DR.lines,DR.kind);DR.lines.forEach((l,n)=>{const e=$('#lt'+n);if(e)e.textContent=rm(Math.round((parseFloat(l.q)||0)*cents(l.p)))});const e=$('#dt');if(e)e.textContent=totText(c,DR.kind==='inv')}
function panel(t,kind,no){PANEL={t,kind,no};render();scrollTo(0,0)}

const NAV=[{id:'dash',l:'Dashboard'},{id:'inv',l:'Invoices'},{id:'bill',l:'Bills'},{id:'je',l:'Ledger & Journal'},{id:'cash',l:'Banking'},{id:'bank',l:'Bank recon'},{id:'items',l:'Items'},{id:'con',l:'Contacts'},{id:'acc',l:'Chart of accounts'},{id:'rep',l:'Reports'},{id:'set',l:'Settings'}];
let cur='dash',E=null;
function go(k){cur=k;E=null;PANEL=null;render()}
function edit(k,i){E={k,i};render();scrollTo(0,0)}
function cancel(){E=null;PANEL=null;render()}
function openTx(id){cur='je';E={k:'je',i:id};render();scrollTo(0,0)}
function resetData(blank){if(confirm('Are you sure?')){seed(blank);save();toast('Reset success');go('dash')}}
function del(k,i){if(confirm('Delete?')){run(()=>{if(k==='inv')S.inv.splice(i,1);else if(k==='bill')S.bill.splice(i,1);else if(k==='je')S.je.splice(i,1);else if(k==='items')S.items.splice(i,1);else if(k==='con')S.con.splice(i,1)},'Deleted')}}
function run(fn,ok){try{fn();save();toast(ok);render()}catch(e){toast(e.message)}}

const V={};
V.dash=function(){
 const inc=sum('income'),exp=sum('expense'),mx=Math.max(inc,exp,1);
 return `<div class="form" style="margin-bottom:14px"><button onclick="go('inv')">Create invoice</button><button onclick="go('bill')">Enter bill</button><button onclick="go('bank')">Import bank statement</button></div><div class="grid"><div class="card"><div class="k">Cash at bank</div><div class="v">${rm(net('1000'))}</div></div>
 <div class="card"><div class="k">Owed to you</div><div class="v">${rm(net('1100'))}</div></div>
 <div class="card"><div class="k">You owe</div><div class="v">${rm(-net('2000'))}</div></div>
 <div class="card"><div class="k">Profit so far</div><div class="v ${inc-exp<0?'neg':''}">${rm(inc-exp)}</div></div></div>
 <div class="box"><div class="k">Income ${rm(inc)}</div><div class="bar" style="width:${inc/mx*100}%"></div><div class="k" style="margin-top:10px">Expenses ${rm(exp)}</div><div class="bar e" style="width:${exp/mx*100}%"></div></div>
 <h3>Recent activity</h3><div class="box wrap"><table><tr><th>Date</th><th>Description</th><th class="n">Amount</th></tr>${S.je.slice(-6).reverse().map(j=>`<tr class="click" onclick="openTx(${j.id})"><td>${j.date}</td><td>${esc(j.memo)}</td><td class="n">${rm(j.lines.reduce((s,l)=>s+(l.d||0),0))}</td></tr>`).join('')}</table></div>
 <div class="eo"><h3>Data</h3><p><button class="g" onclick="resetData(true)">Start blank</button> <button class="g" onclick="resetData(false)">Load sample</button> <button class="g" onclick="backup()">Backup</button></p></div>`;
};

V.inv=function(){return docView('inv')};
V.bill=function(){return docView('bill')};

V.je=function(){
 const rows=S.je.slice().reverse().map((j,idx)=>{
  const originalIdx=S.je.length-1-idx;
  return `<tr class="${E&&E.i===j.id?'hl':''}" onclick="openTx(${j.id})"><td>${j.date}</td><td>${esc(j.memo)}</td><td>${esc(j.ref||'')}</td><td class="n">${rm(j.lines.reduce((s,l)=>s+(l.d||0),0))}</td><td><button class="g" onclick="event.stopPropagation();del('je',${originalIdx})">Delete</button></td></tr>`;
 }).join('');
 return `<div class="box eo"><h3>Ledger & Journal Entries</h3></div>
 <div class="box wrap"><table><tr><th>Date</th><th>Memo</th><th>Ref</th><th class="n">Amount</th><th></th></tr>${rows||'<tr><td colspan=5>No entries.</td></tr>'}</table></div>`;
};

V.cash=function(){return `<div class="box"><h3>Banking</h3></div>`};
V.bank=function(){return `<div class="box"><h3>Bank Reconciliation</h3></div>`};

V.items=function(){
 const e=E&&E.k==='items'?S.items.find(x=>x.id===E.i):null;
 return `<div class="box eo"><div class="form">${e?'<b>Edit item</b>':''}<label>Name<input id="n" value="${esc(e&&e.name)}"></label><label>Price (RM)<input id="a" type="number" step="0.01" value="${e?amtv(e.price):''}"></label><button onclick="${e?`saveItem(${e.id})`:'newItem()'}">${e?'Save':'Add'}</button>${e?'<button class="g" onclick="cancel()">Cancel</button>':''}</div></div>
 <div class="box wrap"><table><tr><th>Name</th><th class="n">Price</th><th></th></tr>${S.items.map(x=>`<tr><td>${esc(x.name)}</td><td class="n">${rm(x.price)}</td><td><button class="g" onclick="edit('items',${x.id})">Edit</button> <button class="g" onclick="del('items',${x.id})">Delete</button></td></tr>`).join('')}</table></div>`;
};

V.con=function(){return `<div class="box"><h3>Contacts</h3><div class="wrap"><table><tr><th>Name</th></tr>${(S.con||[]).map(c=>`<tr><td>${esc(c.name)}</td></tr>`).join('')}</table></div></div>`};
V.acc=function(){return `<div class="box"><h3>Chart of Accounts</h3><div class="wrap"><table><tr><th>Code</th><th>Name</th><th>Type</th></tr>${S.acc.map(a=>`<tr><td>${a.code}</td><td>${esc(a.name)}</td><td>${a.type}</td></tr>`).join('')}</table></div></div>`};
V.rep=function(){return `<div class="box"><h3>Reports</h3></div>`};
V.set=function(){return `<div class="box"><h3>Settings</h3></div>`};

function newItem(){try{S.items.push({id:S.n++,name:val('n'),price:cents(val('a'))});save();toast('Added');render()}catch(e){toast(e.message)}}
function saveItem(id){try{const x=S.items.find(i=>i.id===id);x.name=val('n');x.price=cents(val('a'));save();toast('Saved');cancel()}catch(e){toast(e.message)}}

function docView(kind){
 const i=kind==='inv',e=E&&E.k===kind?S[kind].find(x=>x.no===E.i):null,D=draft(kind,e),L=i?S.inv:S.bill,P=PANEL&&PANEL.kind===kind?PANEL:null,pv=P&&docOf(P.no),c=calc(D.lines,kind),who=i?'Customer':'Vendor';
 const pan=P?`<div class="box eo"><div class="form"><b>Receive Payment - ${P.no}</b><label>Date<input id="pd" type="date" value="${today()}"></label><label>Amount<input id="pa" type="number" step="0.01" value="${amtv(bal(pv))}"></label><button onclick="savePanel()">Save</button><button class="g" onclick="PANEL=null;render()">Cancel</button></div></div>`:'';
 const entry=`<div class="box eo"><div class="form">${e?`<b>Editing ${e.no}</b>`:''}<label>${who}<input value="${esc(D.party)}" onchange="DR.party=this.value"></label><label>Issued<input type="date" value="${D.date}" onchange="DR.date=this.value"></label><label>Due<input type="date" value="${D.due}" onchange="DR.due=this.value"></label></div>
 <div class="wrap" style="margin-top:10px"><table><tr><th>Description</th><th>Qty</th><th>Price</th><th class="n">Total</th><th></th></tr>${D.lines.map((l,n)=>`<tr><td><input value="${esc(l.d)}" onchange="DR.lines[${n}].d=this.value" style="width:100%"></td><td><input type="number" value="${esc(l.q)}" onchange="DR.lines[${n}].q=this.value;recalc()" style="width:70px"></td><td><input type="number" step="0.01" value="${esc(l.p)}" onchange="DR.lines[${n}].p=this.value;recalc()" style="width:100px"></td><td class="n" id="lt${n}">${rm(Math.round((parseFloat(l.q)||0)*cents(l.p)))}</td><td><button class="g" onclick="rmLine(${n})">x</button></td></tr>`).join('')}</table></div>
 <div class="form" style="margin-top:8px"><button class="g" onclick="addLine()">Add line</button><b id="dt" style="margin-left:auto">${totText(c,i)}</b></div>
 <div class="form" style="margin-top:10px"><button onclick="saveDoc('${kind}')">${e?'Save changes':'Save'}</button>${e?'<button class="g" onclick="cancel()">Cancel</button>':''}</div></div>`;
 const rows=L.map((v,k)=>[v,k]).reverse().map(([v,k])=>{const b=bal(v),st=b===0?'<span class="tag p">Paid</span>':'<span class="tag">Open</span>';
  return `<tr><td>${v.no}</td><td>${esc(v.cust||v.ven)}</td><td>${v.date}</td><td class="n">${rm(v.tot)}</td><td class="n">${rm(b)}</td><td>${st}</td><td><button class="g" onclick="panel('pay','${kind}','${v.no}')">Payment</button> <button class="g" onclick="edit('${kind}','${v.no}')">Edit</button> <button class="g" onclick="del('${kind}',${k})">Delete</button></td></tr>`}).join('');
 return `${pan}${entry}<div class="box wrap"><table><tr><th>No.</th><th>${who}</th><th>Issued</th><th class="n">Total</th><th class="n">Balance</th><th>Status</th><th></th></tr>${rows||'<tr><td colspan=7>Nothing here yet.</td></tr>'}</table></div>`;
}

function saveDoc(kind){try{const e=E&&E.k===kind?S[kind].find(x=>x.no===E.i):null;if(e)updateDoc(e,kind,DR);else addDoc(kind,DR);DR=null;save();toast('Saved');render()}catch(err){toast(err.message)}}
function savePanel(){try{const pv=docOf(PANEL.no),amt=cents(val('pa')),dt=val('pd');addPay(pv,PANEL.kind,dt,amt,'1000');PANEL=null;save();toast('Recorded');render()}catch(err){toast(err.message)}}
function backup(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='accounting-backup.json';a.click()}

function render(){
 const nav=$('#nav');if(nav)nav.innerHTML=`<h1>Easy Books</h1>${NAV.map(n=>`<a class="${cur===n.id?'on':''}" onclick="go('${n.id}')">${n.l}</a>`).join('')}<div style="margin-top:20px;padding:8px;font-size:12px;color:var(--mute)">Saved locally</div>`;
 const t=$('#title');if(t)t.textContent=(NAV.find(n=>n.id===cur)||{}).l||'';
 const m=$('#main');if(m){
  let html='';
  if(cur==='dash') html=V.dash();
  else if(cur==='inv') html=V.inv();
  else if(cur==='bill') html=V.bill();
  else if(cur==='je') html=V.je();
  else if(cur==='cash') html=V.cash();
  else if(cur==='bank') html=V.bank();
  else if(cur==='items') html=V.items();
  else if(cur==='con') html=V.con();
  else if(cur==='acc') html=V.acc();
  else if(cur==='rep') html=V.rep();
  else if(cur==='set') html=V.set();
  m.innerHTML=`<div class="box" style="margin-bottom:12px;display:flex;gap:10px;align-items:center"><input type="text" id="global-search" placeholder="Search records, descriptions, amounts..." value="${esc(globalSearchQuery)}" oninput="globalSearchQuery=this.value;renderSearch()" style="flex:1"></div><div id="tab-content">${html}</div>`;
 }
}

function renderSearch(){
 const q=globalSearchQuery.toLowerCase();
 document.querySelectorAll('#tab-content tr').forEach(r=>{
  if(r.parentElement.tagName==='THEAD')return;
  const txt=r.textContent.toLowerCase();
  r.style.display=!q||txt.includes(q)?'':'none';
 });
}

if(!rd(lk('main'))){seed(false);save();}else{S=fix(rd(lk('main')));}
render();
</script>
</body></html>
